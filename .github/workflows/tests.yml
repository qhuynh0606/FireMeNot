name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Block data / model files from being committed
        run: |
          bad=$(git ls-files | grep -Ei '\.(jpg|jpeg|png|npy|npz|pkl|joblib|pt|pth|h5|ckpt)$' | grep -v '^docs/' || true)
          if [ -n "$bad" ]; then
            echo "These files should not be committed (data/weights belong outside git):"
            echo "$bad"
            exit 1
          fi

      - name: Run tests
        run: pytest -v
